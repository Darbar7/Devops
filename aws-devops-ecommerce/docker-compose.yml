version: '3.8'

services:
  db:
    image: postgres:16
    container_name: aws-devops-ecommerce-db-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"

  app:
    build: .
    image: aws-devops-ecommerce-app:latest
    container_name: aws-devops-ecommerce-app-1
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/ecommerce
    depends_on:
      - db
      