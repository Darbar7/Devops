version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: echecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: aws-devops-ecommerce-app:latest
    container_name: aws-devops-ecommerce-app-1
    command: gunicorn --bind 0.0.0.0:5000 --timeout 120 app:app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/echecommerce
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: