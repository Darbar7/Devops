<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - CloudMart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center py-4" style="height: 100vh;">
    <div class="container" style="max-width: 400px;">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="text-center mb-4 fw-bold">Reset Password</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Enter your email address</label>
                    <input type="email" name="email" class="form-control" placeholder="admin@darbar.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Send Reset Link</button>
            </form>
            <div class="text-center">
                <a href="/login" class="text-decoration-none small">Back to Login</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
