<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps E-Commerce Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">DevOps E-Commerce Store</h1>
        
        <div class="row">
            <!-- Product Listing -->
            <div class="col-md-12">
                <h3>Available Products</h3>
                <div class="row">
                    <!-- Loop through products from database -->
                    {% if products %}
                        {% for product in products %}
                        <div class="col-md-4 mb-3">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h5 class="card-title">{{ product[1] }}</h5>
                                    <p class="card-text text-muted">Price: ${{ product[2] }}</p>
                                    <p class="card-text">Stock: {{ product[3] }} available</p>
                                    <button class="btn btn-primary">Add to Cart</button>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    {% else %}
                        <p class="text-muted">No products available yet. Add some to your PostgreSQL database!</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
